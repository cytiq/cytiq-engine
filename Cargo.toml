[workspace]
members = [
    "crates/cytiq-cytonorm",
    "crates/cytiq-classify",
    "crates/cytiq-autospectral",
    "crates/cytiq-autospill",
    "crates/cytiq-clean",
    "crates/cytiq-compensate",
    "crates/cytiq-engine",
    "crates/cytiq-cytoscan",
    "crates/cytiq-density",
    "crates/cytiq-fcs",
    "crates/cytiq-gating",
    "crates/cytiq-manifest",
    "crates/cytiq-mask",
    "crates/cytiq-inspect",
    "crates/cytiq-flowsom",
    "crates/cytiq-peacoqc",
    "crates/cytiq-plot",
    "crates/cytiq-provenance",
    "crates/cytiq-population",
    "crates/cytiq-specimen",
    "crates/cytiq-publish",
    "crates/cytiq-qc",
    "crates/cytiq-spillqc",
    "crates/cytiq-transform",
]
resolver = "3"

[workspace.package]
version = "0.4.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/cytiq/cytiq-engine"
keywords = ["cytometry", "flow-cytometry", "fcs", "bioinformatics"]
categories = ["science"]

# Library crates of this workspace. crates.io resolves the version, local builds
# the path. Keep each version equal to the workspace version above: packages
# are published together, and `just package-check` rejects a mismatch.
[workspace.dependencies]
cytiq-autospectral = { path = "crates/cytiq-autospectral", version = "0.4.1" }
cytiq-autospill = { path = "crates/cytiq-autospill", version = "0.4.1" }
cytiq-classify = { path = "crates/cytiq-classify", version = "0.4.1" }
cytiq-clean = { path = "crates/cytiq-clean", version = "0.4.1" }
cytiq-compensate = { path = "crates/cytiq-compensate", version = "0.4.1" }
cytiq-cytonorm = { path = "crates/cytiq-cytonorm", version = "0.4.1" }
cytiq-cytoscan = { path = "crates/cytiq-cytoscan", version = "0.4.1" }
cytiq-density = { path = "crates/cytiq-density", version = "0.4.1" }
cytiq-fcs = { path = "crates/cytiq-fcs", version = "0.4.1" }
cytiq-flowsom = { path = "crates/cytiq-flowsom", version = "0.4.1" }
cytiq-gating = { path = "crates/cytiq-gating", version = "0.4.1" }
cytiq-manifest = { path = "crates/cytiq-manifest", version = "0.4.1" }
cytiq-mask = { path = "crates/cytiq-mask", version = "0.4.1" }
cytiq-inspect = { path = "crates/cytiq-inspect", version = "0.4.1" }
cytiq-peacoqc = { path = "crates/cytiq-peacoqc", version = "0.4.1" }
cytiq-plot = { path = "crates/cytiq-plot", version = "0.4.1" }
cytiq-provenance = { path = "crates/cytiq-provenance", version = "0.4.1" }
cytiq-population = { path = "crates/cytiq-population", version = "0.4.1" }
cytiq-specimen = { path = "crates/cytiq-specimen", version = "0.4.1" }
cytiq-publish = { path = "crates/cytiq-publish", version = "0.4.1" }
cytiq-qc = { path = "crates/cytiq-qc", version = "0.4.1" }
cytiq-spillqc = { path = "crates/cytiq-spillqc", version = "0.4.1" }
cytiq-transform = { path = "crates/cytiq-transform", version = "0.4.1" }

askama = { version = "0.16.1", default-features = false, features = ["std", "derive"] }
globset = "0.4.21"
serde_arrow = { version = "0.15.1", default-features = false, features = ["arrow-60"] }

# Shared external versions; consumers retain their extra features.
arrow-array = "60.1.0"
arrow-schema = "60.1.0"
csv = "1.3.1"
log = "0.4.30"
nalgebra = { version = "0.35.0", default-features = false, features = ["std"] }
parquet = { version = "60.1.0", default-features = false, features = ["arrow"] }
plotly = "0.14.1"
proptest = "1.12.0"
rayon = "1.10.0"
roxmltree = "0.21.1"
ryu = "1.0.23"
serde = { version = "1.0.228", features = ["derive"] }
serde-saphyr = "2.0.0"
serde_json = "1.0.150"
sha2 = "0.11.1"
tempfile = "3.27.0"
thiserror = "2.0.17"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# Integer overflow aborts instead of wrapping silently. Measured on the parity
# suite and a 225 MB spectral PeacoQC run: no difference beyond noise.
overflow-checks = true
panic = "abort"
strip = "symbols"
