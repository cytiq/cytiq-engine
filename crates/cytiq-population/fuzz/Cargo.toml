# Fuzz targets for population documents, observation and annotation tables. Excluded
# from the workspace: they need cargo-fuzz and a nightly toolchain
# (`just fuzz cytiq-population <target>`).
[package]
name = "cytiq-population-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
bytes = "1"
cytiq-mask = { path = "../../cytiq-mask" }
cytiq-population = { path = ".." }
libfuzzer-sys = "0.4"

[[bin]]
name = "document_json"
path = "fuzz_targets/document_json.rs"
test = false
doc = false
bench = false

[[bin]]
name = "document_yaml"
path = "fuzz_targets/document_yaml.rs"
test = false
doc = false
bench = false

[[bin]]
name = "observations_parquet"
path = "fuzz_targets/observations_parquet.rs"
test = false
doc = false
bench = false

[[bin]]
name = "projected_parquet"
path = "fuzz_targets/projected_parquet.rs"
test = false
doc = false
bench = false

# Not part of the parent workspace.
[workspace]
members = ["."]
