# Keep each extracted helper here: moving a check must not remove mutation coverage.
# 27.1.0's StructField generator bypasses regex filters. Also restrict files;
# mutants_selection.py rejects anything outside the function selection.
examine_globs = [
    "crates/cytiq-engine/src/logging.rs",
    "crates/cytiq-clean/src/debris.rs",
    "crates/cytiq-flowsom/src/model.rs",
    "crates/cytiq-flowsom/src/runner.rs",
    "crates/cytiq-peacoqc/src/runner.rs",
    "crates/cytiq-spillqc/src/runner.rs",
    "crates/cytiq-spillqc/src/preprocess.rs",
    "crates/cytiq-gating/src/parse.rs",
    "crates/cytiq-fcs/src/layout.rs",
    "crates/cytiq-fcs/src/inputs.rs",
    "crates/cytiq-cytonorm/src/bundle.rs",
    "crates/cytiq-cytonorm/src/runner.rs",
    "crates/cytiq-classify/src/features.rs",
    "crates/cytiq-classify/src/lib.rs",
    "crates/cytiq-population/src/observation.rs",
    "crates/cytiq-population/src/artifact.rs",
    "crates/cytiq-population/src/serialization.rs",
    "crates/cytiq-specimen/src/reconcile.rs",
    "crates/cytiq-specimen/src/layout.rs",
    "crates/cytiq-specimen/src/compare.rs",
]
examine_re = [
    'crates/cytiq-fcs/src/inputs.rs:.*\b(resolve_inputs|resolve_glob|filename_matcher|collect_files|is_fcs_path)\b',
    'crates/cytiq-engine/src/logging.rs:.*\bparse_log_level_token\b',
    'crates/cytiq-clean/src/debris.rs:.*\bfit_population\b',
    'crates/cytiq-flowsom/src/model.rs:.*\bpopulations\b',
    'crates/cytiq-flowsom/src/runner.rs:.*\b(subsample_rows|sample_seed|training_rows)\b',
    'crates/cytiq-peacoqc/src/runner.rs:.*\b(isolation_tree_good_bins|isolation_children)\b',
    'crates/cytiq-spillqc/src/preprocess.rs:.*\b(prepare|prepare_logicle_columns)\b',
    'crates/cytiq-gating/src/parse.rs:.*\b(parse_gatingml|parse_transformation|parse_linear_transform|parse_log_transform|parse_asinh_transform)\b',
    'crates/cytiq-fcs/src/layout.rs:.*\b(resolve_layout|resolve_parameter)\b',
    'crates/cytiq-cytonorm/src/bundle.rs:.*\b(validate|validate_panel|validate_som_contract|validate_training_contract|validate_channel_labels|validate_goals|validate_mappings)\b',
    'crates/cytiq-cytonorm/src/runner.rs:.*\b(train_inner|balanced_training_values|train_som|publish_training_model)\b',
    'crates/cytiq-classify/src/features.rs:.*\b(feature_columns_with_normalization|validate_feature_recipe|validate_instrument|feature_indices|flowcyt_columns|validate_fcm_state|compensated_columns|fcm_columns)\b',
    'crates/cytiq-classify/src/lib.rs:.*\b(ClassifyRunner::run|classification_summary|validate_run_config|validate_model_input|prediction_schema|infer_probabilities|validate_probabilities)\b',
    'crates/cytiq-population/src/observation.rs:.*\b(PopulationObservation::validate|is_sha256)\b',
    'crates/cytiq-population/src/artifact.rs:.*\bverify_package\b',
    'crates/cytiq-population/src/serialization.rs:.*\b(parse_document|bounded)\b',
    'crates/cytiq-specimen/src/reconcile.rs:.*\b(reference_ratio|anchor_checks|measured_count|estimate_precision|check_consistency|validate_quantities|index_sources|SpecimenResult::validate|SpecimenResult::outcome_reason)\b',
    'crates/cytiq-specimen/src/layout.rs:.*\b(SpecimenLayout::validate|AnchorLimits::validate)\b',
    'crates/cytiq-specimen/src/compare.rs:.*\b(SpecimenComparison::outcome_reason|compare_row|compare_checks)\b',
]
exclude_globs = ["**/tests/**", "**/*tests.rs", "**/examples/**", "**/benches/**", "**/fuzz/**", "**/build.rs"]
# Near 1, an f32 sum differs from 1 by a multiple of 2^-24. The f32
# value 1e-5 is not such a multiple, so equality cannot occur here.
# Tests cover the closest representable sums on either side of the tolerance.
exclude_re = ['^crates/cytiq-classify/src/lib\.rs:.*replace > with >= in validate_probabilities$']
additional_cargo_args = ["--locked"]
gitignore = true
copy_target = true
# Match ordinary cargo test builds; the workspace has no deny(warnings) attributes.
cap_lints = false
test_tool = "cargo"
test_workspace = false
timeout_multiplier = 5.0
minimum_test_timeout = 20.0
output = "target/mutation"
