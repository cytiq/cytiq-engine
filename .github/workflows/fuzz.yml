name: Fuzz

# Fuzzes the FCS reader and spillover parser, the population document and
# observation-table readers, and specimen comparison: weekly for 10 minutes a
# target, on demand, and for one minute on pull requests that change a fuzzed
# crate. The corpus is kept in the Actions cache between runs. A crash uploads
# its input; turn it into a regression as the crate's CONTRIBUTING.md
# describes.

on:
  pull_request:
    paths:
      - crates/cytiq-fcs/**
      - crates/cytiq-gating/**
      - crates/cytiq-population/**
      - crates/cytiq-specimen/**
      - crates/cytiq-mask/**
      - crates/cytiq-provenance/**
      - crates/cytiq-manifest/**
      - crates/cytiq-qc/**
      - Cargo.toml
      - Cargo.lock
      - mise.toml
      - mise.lock
      - justfile
      - .github/workflows/fuzz.yml
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds to fuzz each target
        type: number
        required: false
        default: 600

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { crate: cytiq-fcs, target: read_fcs }
          - { crate: cytiq-fcs, target: spillover_keyword }
          - { crate: cytiq-population, target: document_json }
          - { crate: cytiq-population, target: document_yaml }
          - { crate: cytiq-population, target: observations_parquet }
          - { crate: cytiq-population, target: projected_parquet }
          - { crate: cytiq-specimen, target: specimen_documents }
          - { crate: cytiq-gating, target: gatingml }
    env:
      FUZZ_SECONDS: ${{ github.event_name == 'pull_request' && '60' || inputs.seconds || '600' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # just fuzz installs the nightly that mise.toml pins (CYTIQ_FUZZ_TOOLCHAIN).
      - name: Install Rust and cargo-fuzz
        uses: cytiq/cytiq-ci/.github/actions/mise@0.5.0
        with:
          tools: rust,cargo:cargo-fuzz

      - name: Cache fuzz build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/${{ matrix.crate }}/fuzz -> target
          save-if: ${{ github.event_name != 'pull_request' }}
          # The stable toolchain mise selects names the cache; the nightly builds.
          key: ${{ env.CYTIQ_FUZZ_TOOLCHAIN }}
          cache-bin: false

      # Runs restore the latest corpus. Scheduled and manual runs save theirs
      # under a new key, even after a crash; pull requests only read it, as
      # in ci.yml.
      - name: Restore corpus
        uses: actions/cache/restore@v6
        with:
          path: crates/${{ matrix.crate }}/fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-

      - name: Fuzz
        run: |
          [[ "$FUZZ_SECONDS" =~ ^[1-9][0-9]*$ ]]
          just fuzz ${{ matrix.crate }} ${{ matrix.target }} "$FUZZ_SECONDS"

      - name: Save corpus
        if: always() && github.event_name != 'pull_request'
        uses: actions/cache/save@v6
        with:
          path: crates/${{ matrix.crate }}/fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}

      - name: Upload crash inputs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: crates/${{ matrix.crate }}/fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
