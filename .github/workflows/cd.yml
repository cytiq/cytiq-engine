name: Continuous Delivery

# An RC tag (X.Y.Z-rcN) opens the changelog PR and publishes
# ghcr.io/cytiq/cytiq-engine:X.Y.Z-rcN; merging that PR tags X.Y.Z, creates the
# GitHub Release and publishes :X.Y.Z and :latest. Images are built for
# linux/amd64 and linux/arm64 (each on a native runner) and carry SBOM and
# provenance attestations; deployments pin the digest the merge job reports.
# The merge also dispatches crates-publish.yml on the X.Y.Z tag.

on:
  push:
    tags:
      - "*.*.*-rc*"
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  scientific:
    needs: resolve-version
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.merged == true &&
       startsWith(github.event.pull_request.head.ref, 'chore/update-changelog-'))
    uses: ./.github/workflows/scientific.yml
    with:
      full: true
      ref: ${{ needs.resolve-version.outputs.commit }}
    permissions:
      contents: read

  changelog:
    needs: scientific
    if: github.event_name == 'push'
    uses: cytiq/cytiq-ci/.github/workflows/release.yml@0.4.0
    with:
      tag: ${{ github.ref_name }}
      update_changelog: true
    secrets:
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      GPG_FINGERPRINT: ${{ secrets.GPG_FINGERPRINT }}
      GH_TOKEN: ${{ secrets.GH_TOKEN }}

  release:
    needs: [scientific, resolve-version]
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'chore/update-changelog-')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      # The shared release workflow checks out a moving main. A long scientific
      # run must never publish a later, unvalidated main head instead.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-version.outputs.commit }}
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN || github.token }}
          persist-credentials: false
      - name: Import release signing key
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
          fingerprint: ${{ secrets.GPG_FINGERPRINT }}
          git_user_signingkey: true
          git_tag_gpgsign: true
          git_committer_name: Nikita Syzrantsev
          git_committer_email: 47356892+nsyzrantsev@users.noreply.github.com
      - name: Tag the validated commit without replacing existing tags
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
          VERSION: ${{ needs.resolve-version.outputs.version }}
          COMMIT: ${{ needs.resolve-version.outputs.commit }}
        run: |
          gh auth setup-git
          python3 .github/scripts/tag_validated_release.py
      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ needs.resolve-version.outputs.version }}
          name: ${{ needs.resolve-version.outputs.version }}
          target_commitish: ${{ needs.resolve-version.outputs.commit }}
          body_path: RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
      - name: Clean up this version's RC tags
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          while IFS= read -r tag; do
            git push origin --delete "$tag"
          done < <(git tag --list "$VERSION-rc*")

  # The version to tag the image with and the exact commit to build: the RC
  # tag's commit, or the merge commit of the changelog PR (never the
  # pull_request event's refs/pull/N/merge ref).
  resolve-version:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.merged == true &&
       startsWith(github.event.pull_request.head.ref, 'chore/update-changelog-'))
    runs-on: ${{ vars.CI_LIGHT_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 10
    permissions: {}
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      latest: ${{ steps.resolve.outputs.latest }}
      commit: ${{ steps.resolve.outputs.commit }}
    steps:
      - id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          {
            if [ "$EVENT_NAME" = "push" ]; then
              echo "version=$REF_NAME"
              echo "latest=false"
              echo "commit=$SHA"
            else
              echo "version=${PR_HEAD_REF#chore/update-changelog-}"
              echo "latest=true"
              echo "commit=$MERGE_SHA"
            fi
          } >> "$GITHUB_OUTPUT"

  build-and-push:
    needs: [resolve-version, scientific]
    uses: cytiq/cytiq-ci/.github/workflows/docker-publish.yml@0.4.0
    with:
      image: cytiq-engine
      dockerfile: docker/Dockerfile
      version: ${{ needs.resolve-version.outputs.version }}
      latest: ${{ needs.resolve-version.outputs.latest == 'true' }}
      ref: ${{ needs.resolve-version.outputs.commit }}
      build_args: |
        CYTIQ_BUILD_COMMIT=${{ needs.resolve-version.outputs.commit }}
      platforms: linux/amd64,linux/arm64
      enable_cache: true
    permissions:
      contents: read
      packages: write

  # crates.io publication runs as its own workflow on the release tag: the
  # `crates-io` environment and the trusted publisher then see refs/tags/X.Y.Z,
  # and a failed upload is retried without rebuilding images. Skipped with
  # `release`, so it runs only when a changelog PR is merged.
  publish-crates:
    needs: [release, resolve-version]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch crates.io publication
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ needs.resolve-version.outputs.version }}
          COMMIT: ${{ needs.resolve-version.outputs.commit }}
        run: |
          # The release pins the validated commit; still verify the remote tag
          # so an unexpected external retag cannot publish different crates.
          tag=$(gh api "repos/$REPOSITORY/git/ref/tags/$VERSION" --jq '.object | "\(.type) \(.sha)"')
          read -r type sha <<< "$tag"
          if [ "$type" = tag ]; then
            sha=$(gh api "repos/$REPOSITORY/git/tags/$sha" --jq .object.sha)
          fi
          if [ "$sha" != "$COMMIT" ]; then
            echo "::error::tag $VERSION points to $sha, not $COMMIT, the commit the images were built from"
            exit 1
          fi
          gh workflow run crates-publish.yml --repo "$REPOSITORY" --ref "$VERSION"
