name: Continuous Integration

# Fast checks for every pull request, merge-queue draft and push to main.
# Release and Docker builds live in package.yml.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # The workspace declares no features, so clippy with --all-targets
  # --all-features compiles everything a separate `cargo check` would.
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Rust and Python as mise.toml pins them; the toolchain includes rustfmt and Clippy.
      - name: Install Rust and Python
        uses: cytiq/cytiq-ci/.github/actions/mise@4765ebc677f78300946546051b0d9b25bb13a1dc # main, squash merge of cytiq-ci#26
        with:
          tools: rust,python

      - name: Check formatting
        run: cargo fmt --all -- --check

      # Pull requests restore main's cache but never save their own: per-PR
      # caches overflowed the 10 GB repository limit and evicted main's.
      - name: Cache Cargo artifacts
        id: cargo-cache
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      # What a release would otherwise reveal on crates.io: a crate without
      # its description or license, or a stale internal version requirement.
      - name: Check crates.io packaging
        run: python3 .github/scripts/publish_crates.py --check

      - &cache-telemetry
        name: Record Cargo cache restore
        if: always()
        continue-on-error: true
        env:
          CACHE_HIT: ${{ steps.cargo-cache.outputs.cache-hit }}
        run: |
          mkdir -p "$RUNNER_TEMP/ci-cache"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          hit = {"true": True, "false": False}.get(os.environ["CACHE_HIT"])
          record = {"schema_version": 1, "run_id": int(os.environ["GITHUB_RUN_ID"]),
                    "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
                    "job": os.environ["GITHUB_JOB"], "caches": [{"name": "cargo", "hit": hit}]}
          (Path(os.environ["RUNNER_TEMP"]) / "ci-cache/cache.json").write_text(json.dumps(record))
          PY

      - &upload-cache-telemetry
        name: Upload cache telemetry
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: ci-cache-${{ github.job }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-cache/cache.json
          if-no-files-found: ignore
          retention-days: 35

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TARGET_DIR: target/coverage
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The toolchain includes llvm-tools; mise.toml pins the coverage and CRAP tools.
      - name: Install Rust, Python, coverage and CRAP tools
        uses: cytiq/cytiq-ci/.github/actions/mise@4765ebc677f78300946546051b0d9b25bb13a1dc # main, squash merge of cytiq-ci#26
        with:
          tools: rust,python,github:taiki-e/cargo-llvm-cov,github:minikin/cargo-crap

      - name: Cache Cargo artifacts
        id: cargo-cache
        uses: Swatinem/rust-cache@v2
        with:
          key: coverage-v1
          workspaces: . -> target/coverage
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # Tools come from mise; a cached ~/.cargo/bin could shadow them.
          cache-bin: false

      - name: Test and collect coverage
        id: coverage
        run: bash .github/scripts/crap.sh coverage

      - name: Verify scientific fixtures
        run: |
          python3 parity/scientific/check_fixtures.py
          python3 -m unittest discover -s parity/scientific -p 'test_registry.py'

      - name: Report CRAP
        id: crap
        run: bash .github/scripts/crap.sh report

      - name: Upload CRAP report
        if: ${{ !cancelled() && steps.coverage.outcome == 'success' && steps.crap.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: crap-report
          path: target/quality/
          if-no-files-found: error
          retention-days: 35

      - *cache-telemetry
      - *upload-cache-telemetry
